<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VALORANT QUEUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b1014;
    --panel:#111820;
    --panel-2:#161f28;
    --line:#26313b;
    --red:#ff4655;
    --red-dim:#7a2530;
    --steel:#8a97a0;
    --white:#ece8e1;
    --green:#3ddc84;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--void); color:var(--white); font-family:'Inter',sans-serif; min-height:100%;}
  body{
    background-image:
      linear-gradient(180deg, rgba(255,70,85,.05), transparent 300px),
      repeating-linear-gradient(135deg, rgba(255,255,255,.015) 0 2px, transparent 2px 40px);
    padding:0 0 60px 0;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:56px 0 36px 0;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; top:-40%; right:-10%;
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(255,70,85,.18), transparent 65%);
    pointer-events:none;
  }
  .kicker{
    font-family:'Teko',sans-serif; font-weight:600; font-size:18px;
    letter-spacing:.14em; color:var(--red); text-transform:uppercase;
    display:flex; align-items:center; gap:10px;
  }
  .kicker .dot{width:8px; height:8px; background:var(--red); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  .kicker .me{color:var(--steel); font-weight:500; letter-spacing:.06em;}
  .kicker .me b{color:var(--white);}
  .title{
    font-family:'Teko',sans-serif; font-weight:700; font-size:86px; line-height:.92;
    letter-spacing:.01em; text-transform:uppercase; margin-top:6px;
    color:var(--white);
  }
  .title span{color:var(--red);}
  .hero-stats{display:flex; gap:36px; margin-top:28px;}
  .stat-num{font-family:'Teko',sans-serif; font-size:44px; font-weight:600; color:var(--white); line-height:1;}
  .stat-num.live{color:var(--green);}
  .stat-label{font-size:12px; color:var(--steel); letter-spacing:.08em; text-transform:uppercase; margin-top:2px;}

  /* ---------- SECTIONS ---------- */
  .section{padding:44px 0 0 0;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .section-title{
    font-family:'Teko',sans-serif; font-size:30px; font-weight:600; text-transform:uppercase;
    letter-spacing:.03em; display:flex; align-items:center; gap:10px;
  }
  .section-title .bar{width:5px; height:22px; background:var(--red);}

  /* buttons + inputs */
  input[type=text]{
    background:var(--void); border:1px solid var(--line); color:var(--white);
    padding:11px 14px; font-family:'Inter',sans-serif; font-size:14px; outline:none; width:100%;
  }
  input[type=text]:focus{border-color:var(--red);}
  .btn{
    font-family:'Teko',sans-serif; font-weight:600; font-size:17px; letter-spacing:.05em;
    text-transform:uppercase; background:var(--red); color:#160507; border:none;
    padding:11px 22px; cursor:pointer;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    transition:transform .12s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:hover{background:#ff5c6a; transform:translateY(-1px);}
  .btn:disabled{background:var(--line); color:var(--steel); cursor:not-allowed; transform:none;}
  .btn.ghost{
    background:transparent; color:var(--white); border:1px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--red); color:var(--red); background:transparent;}
  .btn.small{font-size:14px; padding:7px 14px;}

  /* Online roster */
  .roster{display:flex; flex-wrap:wrap; gap:10px;}
  .chip{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); padding:9px 14px 9px 10px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    font-size:13.5px;
  }
  .chip.me{border-color:var(--red);}
  .chip .pulse{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(61,220,132,.6); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55);} 70%{box-shadow:0 0 0 6px rgba(61,220,132,0);} 100%{box-shadow:0 0 0 0 rgba(61,220,132,0);}}
  .empty{color:var(--steel); font-size:13.5px; padding:14px 0; border-top:1px dashed var(--line); margin-top:6px;}

  /* Party codes */
  .code-form{display:flex; gap:10px; margin-bottom:16px;}
  .code-form input{max-width:220px;}
  .code-list{display:flex; flex-direction:column; gap:8px;}
  .code-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel); border:1px solid var(--line); padding:12px 16px;
  }
  .code-left{display:flex; align-items:center; gap:14px;}
  .code-val{font-family:'Teko',sans-serif; font-size:24px; letter-spacing:.08em; color:var(--red); font-weight:600;}
  .code-meta{font-size:12px; color:var(--steel);}

  /* Rooms */
  .rooms-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;}
  .room-card{
    background:var(--panel); border:1px solid var(--line); padding:18px;
    display:flex; flex-direction:column; gap:12px; position:relative;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
  }
  .room-card.full{border-color:var(--red-dim);}
  .room-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .room-name{font-family:'Teko',sans-serif; font-size:24px; letter-spacing:.02em;}
  .room-count{font-family:'Teko',sans-serif; font-size:22px; color:var(--steel);}
  .room-count b{color:var(--white);}
  .room-count.full-txt{color:var(--red);}
  .bar-track{height:5px; background:var(--void); width:100%;}
  .bar-fill{height:100%; background:var(--red); transition:width .25s ease;}
  .members{display:flex; flex-wrap:wrap; gap:6px;}
  .member-tag{font-size:11.5px; background:var(--void); border:1px solid var(--line); padding:3px 8px; color:var(--steel);}
  .room-actions{display:flex; gap:8px; margin-top:auto;}

  /* Quick add room card - inline, no modal */
  .add-room-card{
    border:1px dashed var(--line); padding:18px;
    display:flex; flex-direction:column; gap:12px; justify-content:center;
  }
  .add-room-card .add-label{
    font-family:'Teko',sans-serif; font-size:17px; letter-spacing:.05em; text-transform:uppercase; color:var(--steel);
  }
  .add-room-card .add-row{display:flex; gap:8px;}
  .add-room-card input{background:var(--panel-2);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--red); padding:12px 20px; font-size:13.5px;
    opacity:0; transition:.2s ease; z-index:80; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{color:var(--steel); font-size:12px; text-align:center; margin-top:60px; padding-top:20px; border-top:1px solid var(--line);}

  @media(max-width:560px){
    .title{font-size:56px;}
    .hero-stats{gap:22px;}
    .code-form{flex-direction:column;}
    .code-form input{max-width:100%;}
    .add-room-card .add-row{flex-direction:column;}
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="hero">
      <div class="kicker"><span class="dot"></span> ONLINE QUEUE SYSTEM</div>
      <div class="title">VALORANT<br><span>QUEUE.</span></div>
      <div class="hero-stats">
        <div>
          <div class="stat-num live" id="onlineCount">0</div>
          <div class="stat-label">Players Online</div>
        </div>
        <div>
          <div class="stat-num" id="roomCount">0</div>
          <div class="stat-label">Active Rooms</div>
        </div>
        <div>
          <div class="stat-num" id="codeCount">0</div>
          <div class="stat-label">Party Codes</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>Online Now</div>
      </div>
      <div class="roster" id="roster"></div>
      <div class="empty" id="rosterEmpty" style="display:none;">No one else here yet — share the link.</div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>Party Codes</div>
      </div>
      <div class="code-form">
        <input type="text" id="codeInput" placeholder="PARTY CODE" maxlength="12">
        <button class="btn" id="addCodeBtn">Post Code</button>
      </div>
      <div class="code-list" id="codeList"></div>
      <div class="empty" id="codeEmpty" style="display:none;">No codes posted yet.</div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>Rooms</div>
      </div>
      <div class="rooms-grid" id="roomsGrid"></div>
    </div>

    <footer>Live while this page stays open</footer>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  const clientId = 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  const TAGS = ['GHOST','VIPER','RAVEN','BLAZE','ECHO','FALCON','STORM','SHADOW','RANGER','HAVOC','CIPHER','NOVA','WOLF','TITAN','REAPER','FROST','DRIFT','OMEGA'];
  const myName = TAGS[Math.floor(Math.random()*TAGS.length)] + '-' + (100 + Math.floor(Math.random()*900));
  const ROOM_CAPACITY = 5;
  const STALE_MS = 20000;
  const HEARTBEAT_MS = 6000;
  const POLL_MS = 4000;

  const $ = id => document.getElementById(id);
  const roster = $('roster'), rosterEmpty = $('rosterEmpty');
  const codeInput = $('codeInput'), addCodeBtn = $('addCodeBtn'), codeList = $('codeList'), codeEmpty = $('codeEmpty');
  const roomsGrid = $('roomsGrid');
  const onlineCountEl = $('onlineCount'), roomCountEl = $('roomCount'), codeCountEl = $('codeCount');
  const toastEl = $('toast');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2200);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- PRESENCE ----------
  async function heartbeat(){
    try{
      await window.storage.set('presence:' + clientId, JSON.stringify({name: myName, ts: Date.now()}), true);
    }catch(e){ console.error('heartbeat failed', e); }
  }
  async function leavePresence(){
    try{ await window.storage.delete('presence:' + clientId, true); }catch(e){}
  }
  window.addEventListener('beforeunload', leavePresence);

  // ---------- REFRESH ----------
  async function refreshAll(){
    await Promise.all([refreshRoster(), refreshCodes(), refreshRooms()]);
  }

  async function refreshRoster(){
    try{
      const listRes = await window.storage.list('presence:', true);
      const keys = (listRes && listRes.keys) || [];
      const now = Date.now();
      const players = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(!r) continue;
          const data = JSON.parse(r.value);
          if(now - data.ts <= STALE_MS){
            players.push({...data, id: k.replace('presence:','')});
          }
        }catch(e){}
      }
      players.sort((a,b) => a.name.localeCompare(b.name));
      onlineCountEl.textContent = players.length;
      roster.innerHTML = players.map(p =>
        `<div class="chip ${p.id===clientId?'me':''}"><span class="pulse"></span>${escapeHtml(p.name)}${p.id===clientId?' (you)':''}</div>`
      ).join('');
      rosterEmpty.style.display = players.length ? 'none' : 'block';
    }catch(e){ console.error('refreshRoster failed', e); }
  }

  async function refreshCodes(){
    try{
      const listRes = await window.storage.list('codes:', true);
      const keys = (listRes && listRes.keys) || [];
      const entries = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(!r) continue;
          entries.push({key:k, data: JSON.parse(r.value)});
        }catch(e){}
      }
      entries.sort((a,b) => b.data.ts - a.data.ts);
      codeCountEl.textContent = entries.length;
      codeList.innerHTML = entries.map(en => `
        <div class="code-row">
          <div class="code-left">
            <div class="code-val">${escapeHtml(en.data.code)}</div>
            <div class="code-meta">by ${escapeHtml(en.data.name)}</div>
          </div>
          <button class="btn small ghost" data-copy="${escapeHtml(en.data.code)}">Copy</button>
        </div>
      `).join('');
      codeEmpty.style.display = entries.length ? 'none' : 'block';
      codeList.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(btn.getAttribute('data-copy')).then(()=>toast('Code copied'));
        });
      });
    }catch(e){ console.error('refreshCodes failed', e); }
  }

  async function refreshRooms(){
    try{
      const listRes = await window.storage.list('rooms:', true);
      const keys = (listRes && listRes.keys) || [];
      const rooms = [];
      for(const k of keys){
        try{
          const r = await window.storage.get(k, true);
          if(!r) continue;
          rooms.push({id: k.replace('rooms:',''), key:k, data: JSON.parse(r.value)});
        }catch(e){}
      }
      rooms.sort((a,b) => a.data.ts - b.data.ts);
      roomCountEl.textContent = rooms.length;

      let html = rooms.map(rm => {
        const members = rm.data.members || [];
        const cap = ROOM_CAPACITY;
        const isFull = members.length >= cap;
        const iAmIn = members.some(m => m.id === clientId);
        const pct = Math.min(100, Math.round((members.length/cap)*100));
        const link = location.href.split('#')[0] + '#room=' + rm.id;
        return `
        <div class="room-card ${isFull ? 'full':''}">
          <div class="room-top">
            <div class="room-name">${escapeHtml(rm.data.name)}</div>
            <div class="room-count ${isFull?'full-txt':''}"><b>${members.length}</b>/${cap}</div>
          </div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="members">
            ${members.map(m => `<span class="member-tag">${escapeHtml(m.name)}</span>`).join('') || '<span class="member-tag">Empty</span>'}
          </div>
          <div class="room-actions">
            ${iAmIn
              ? `<button class="btn ghost small" data-leave="${rm.id}" style="flex:1;">Leave</button>`
              : `<button class="btn small" data-join="${rm.id}" style="flex:1;" ${isFull?'disabled':''}>${isFull?'Full':'Join'}</button>`
            }
            <button class="btn ghost small" data-link="${link}">Copy Link</button>
          </div>
        </div>`;
      }).join('');

      html += `
        <div class="add-room-card">
          <div class="add-label">New Room</div>
          <div class="add-row">
            <input type="text" id="roomNameInput" placeholder="Room name" maxlength="24">
            <button class="btn small" id="createRoomBtn">Create</button>
          </div>
        </div>`;
      roomsGrid.innerHTML = html;

      roomsGrid.querySelectorAll('[data-join]').forEach(btn => {
        btn.addEventListener('click', () => joinRoom(btn.getAttribute('data-join')));
      });
      roomsGrid.querySelectorAll('[data-leave]').forEach(btn => {
        btn.addEventListener('click', () => leaveRoom(btn.getAttribute('data-leave')));
      });
      roomsGrid.querySelectorAll('[data-link]').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(btn.getAttribute('data-link')).then(()=>toast('Room link copied'));
        });
      });
      const roomNameInput = $('roomNameInput'), createRoomBtn = $('createRoomBtn');
      if(createRoomBtn){
        createRoomBtn.addEventListener('click', createRoom);
        roomNameInput.addEventListener('keydown', e => { if(e.key==='Enter') createRoom(); });
      }
    }catch(e){ console.error('refreshRooms failed', e); }
  }

  // ---------- PARTY CODES ----------
  addCodeBtn.addEventListener('click', postCode);
  codeInput.addEventListener('keydown', e => { if(e.key==='Enter') postCode(); });

  async function postCode(){
    const val = codeInput.value.trim();
    if(!val) return;
    const id = 'codes:' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    try{
      const res = await window.storage.set(id, JSON.stringify({code: val, name: myName, ts: Date.now()}), true);
      if(!res){ toast('Failed to post code'); return; }
      codeInput.value = '';
      toast('Code posted');
      refreshCodes();
    }catch(e){ console.error(e); toast('Failed to post code'); }
  }

  // ---------- ROOMS ----------
  async function createRoom(){
    const nameInput = $('roomNameInput');
    const name = (nameInput ? nameInput.value.trim() : '') || 'Squad Room';
    const id = 'rooms:' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    try{
      const res = await window.storage.set(id, JSON.stringify({
        name, members: [{id: clientId, name: myName}], ts: Date.now()
      }), true);
      if(!res){ toast('Failed to create room'); return; }
      toast('Room created');
      refreshRooms();
    }catch(e){ console.error(e); toast('Failed to create room'); }
  }

  async function joinRoom(id){
    const key = 'rooms:' + id;
    try{
      const r = await window.storage.get(key, true);
      if(!r) return;
      const data = JSON.parse(r.value);
      const members = data.members || [];
      if(members.some(m => m.id === clientId)) return;
      if(members.length >= ROOM_CAPACITY){ toast('Room is full'); return; }
      members.push({id: clientId, name: myName});
      data.members = members;
      await window.storage.set(key, JSON.stringify(data), true);
      toast('Joined room');
      refreshRooms();
    }catch(e){ console.error(e); toast('Failed to join'); }
  }

  async function leaveRoom(id){
    const key = 'rooms:' + id;
    try{
      const r = await window.storage.get(key, true);
      if(!r) return;
      const data = JSON.parse(r.value);
      data.members = (data.members || []).filter(m => m.id !== clientId);
      await window.storage.set(key, JSON.stringify(data), true);
      refreshRooms();
    }catch(e){ console.error(e); toast('Failed to leave'); }
  }

  // ---------- START ----------
  heartbeat();
  setInterval(heartbeat, HEARTBEAT_MS);
  refreshAll();
  setInterval(refreshAll, POLL_MS);
})();
</script>
</body>
</html>
